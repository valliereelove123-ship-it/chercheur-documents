name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer Java  17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer les dépendances
        run: npm install

      - name: Ajouter la plateforme Android
        run: npx cap add  android

      - name: Générer les icônes (si @capacitor/assets présent)
        run: |
          npm install @capacitor/assets --no-save
          npx capacitor-assets generate --android || true

      - name: Synchroniser les fichiers web
        run: npx cap sync android

      - name: Rendre gradlew exécutable
        run: chmod +x android/gradlew

      - name: Compiler l'APK (debug)
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Publier l'APK comme artefact téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: eve-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
